# Shared dev gateway for every checkout on the local kind cluster — applied once
# by `just cluster-up` (NOT by Tilt, which manages only per-checkout namespaced
# objects). Each checkout registers HTTPRoutes from its own namespace
# (generated by its Tiltfile); `allowedRoutes: from: All` admits them.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: gateway-system
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      protocol: HTTP
      # 8080, not 80: keeps host port 80 free for the IPv4-only loopback
      # forwarder that `just cluster-up` publishes (127.0.0.1:80 -> this port),
      # which is what makes http://<svc>.<checkout>.localhost work.
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
