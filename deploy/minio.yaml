apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-s3
  labels:
    app: local-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-s3
  template:
    metadata:
      labels:
        app: local-s3
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Local-only convenience sidecar: waits for MinIO, then creates the
        # bucket and uploads a few empty test objects via the S3 API (objects
        # must go through the API, not the data dir, to be valid MinIO objects).
        - name: seed
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local "http://127.0.0.1:9000" "$S3_ACCESS_ID" "$S3_SECRET"; do
                echo "waiting for minio..."
                sleep 2
              done
              mc mb --ignore-existing "local/$S3_BUCKET"
              for n in 1 2 3; do
                echo -n "" | mc pipe "local/$S3_BUCKET/test-$n.txt"
              done
              echo "seeded bucket '$S3_BUCKET'"
              # Keep the sidecar alive so the pod stays Ready.
              tail -f /dev/null
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
          envFrom:
            - secretRef:
                name: s3-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - :9001
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_ACCESS_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_SECRET
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: s3-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: s3-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: local-s3
spec:
  ports:
    - port: 9000
      targetPort: s3
      name: s3
    - port: 9001
      targetPort: console
      name: console
  selector:
    app: local-s3
