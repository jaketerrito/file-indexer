# Local-dev-only seed sidecar, patched into deploy/base's local-s3 Deployment:
# waits for RustFS, then creates the bucket and uploads the sample dataset
# (seed/, mounted below via the seed-data ConfigMap the Tiltfile generates —
# see seed.md) via the S3 API with aws-cli — objects must go through the API,
# not the data dir, to be valid S3 objects. Seeding is a dev convenience, so
# it lives in this overlay; deploy/base's local-s3 stays seed-free.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-s3
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: amazon/aws-cli:2.37.4
          workingDir: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until aws --endpoint-url http://127.0.0.1:9000 s3 mb "s3://$S3_BUCKET"; do
                echo "waiting for s3 store..."
                sleep 2
              done
              # Copy files individually rather than recursive copy:
              # a ConfigMap volume mount is a symlink farm (..data -> ..TIMESTAMP/),
              # so a recursive copy would follow hidden dirs and create junk keys.
              # A plain glob skips dotfiles, seeing only real keys.
              for f in /seed/*; do
                aws --endpoint-url http://127.0.0.1:9000 s3 cp "$f" "s3://$S3_BUCKET/$(basename "$f")"
              done
              # One nested object so a folder exists to browse/search
              aws --endpoint-url http://127.0.0.1:9000 s3 cp /seed/todo.txt "s3://$S3_BUCKET/docs/todo.txt"
              echo "seeded bucket '$S3_BUCKET' from /seed"
              touch /tmp/seeded
              # Keep the sidecar alive so the pod stays Ready.
              tail -f /dev/null
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/seeded"]
            initialDelaySeconds: 2
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_ACCESS_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_SECRET
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: s3-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /logs
            - name: seed-data
              mountPath: /seed
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: seed-data
          configMap:
            name: seed-data
