# Local-dev-only seed sidecar, patched into deploy/base's local-s3 Deployment:
# waits for MinIO, then creates the bucket and uploads the sample dataset
# (seed/, mounted below via the seed-data ConfigMap the Tiltfile generates —
# see seed.md) via the S3 API — objects must go through the API, not the data
# dir, to be valid MinIO objects. Seeding is a dev convenience, so it lives in
# this overlay; deploy/base's MinIO stays seed-free.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-s3
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local "http://127.0.0.1:9000" "$S3_ACCESS_ID" "$S3_SECRET"; do
                echo "waiting for minio..."
                sleep 2
              done
              mc mb --ignore-existing "local/$S3_BUCKET"
              # Copy files individually rather than `mc cp --recursive
              # /seed/`: a ConfigMap volume mount is a symlink farm
              # (..data -> ..TIMESTAMP/, plus a same-named symlink per key),
              # and a recursive copy follows the hidden ..TIMESTAMP/ dir too,
              # duplicating every object under a second, junk key. A plain
              # glob skips dotfiles, so this only ever sees the real keys.
              for f in /seed/*; do
                mc cp "$f" "local/$S3_BUCKET/$(basename "$f")"
              done
              echo "seeded bucket '$S3_BUCKET' from /seed"
              # Keep the sidecar alive so the pod stays Ready.
              tail -f /dev/null
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
          envFrom:
            - secretRef:
                name: s3-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: seed-data
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed-data
          configMap:
            name: seed-data
