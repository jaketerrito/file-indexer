apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local-dev overlay built by the Tiltfile. No `namespace:` field on purpose:
# the per-checkout namespace comes from `tilt --namespace` (like
# `kubectl apply -n` / ArgoCD destination.namespace), keeping every manifest
# applyable as-is. The gateway HTTPRoutes are not manifests at all: their
# hostnames carry the checkout namespace, which Gateway API cannot
# parameterize natively, so the Tiltfile generates them (that also keeps
# `just lint-k8s` — kubeconform -strict, no Gateway API schemas — able to
# validate everything the kustomization builds). The seed dataset (seed/,
# seed.md) and the MinIO seed sidecar (seed-sidecar.yaml patch) live here
# because seeding is dev-only; base MinIO stays seed-free. Likewise the files
# service's browser-facing S3_PUBLIC_ENDPOINT (files-public-endpoint.yaml
# patch): presign targets are environment-specific, so base files.yaml stays
# generic. Postgres and MinIO (and the db-secret/s3-secret whose values point
# at them) live here too: they ARE the local environment — any other
# environment supplies its own secrets against real infra.
resources:
  - ../../base
  - postgres.yaml
  - minio.yaml
patches:
  - path: seed-sidecar.yaml
  - path: files-public-endpoint.yaml

# disableNameSuffixHash is load-bearing: the services reference these secrets
# by fixed name via envFrom.
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: db-secret
    literals:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PASSWORD=mysecretpassword
  - name: s3-secret
    literals:
      - S3_ENDPOINT=local-s3:9000
      - S3_ACCESS_ID=user
      - S3_SECRET=password
      - S3_BUCKET=test
      # SigV4 signing region; us-east-1 is MinIO's default.
      - S3_REGION=us-east-1
