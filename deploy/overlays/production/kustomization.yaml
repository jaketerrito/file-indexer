apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# All images share one tag because this is a monorepo with single-version
# releases. The release workflow's sed depends on this invariant.
images:
  - name: migrate
    newName: ghcr.io/jaketerrito/file-indexer/migrate
    newTag: v0.1.1
  - name: index-stat
    newName: ghcr.io/jaketerrito/file-indexer/index-stat
    newTag: v0.1.1
  - name: index-preview
    newName: ghcr.io/jaketerrito/file-indexer/index-preview
    newTag: v0.1.1
  - name: index-exif
    newName: ghcr.io/jaketerrito/file-indexer/index-exif
    newTag: v0.1.1
  - name: files
    newName: ghcr.io/jaketerrito/file-indexer/files
    newTag: v0.1.1
  - name: search
    newName: ghcr.io/jaketerrito/file-indexer/search
    newTag: v0.1.1
  - name: crawler
    newName: ghcr.io/jaketerrito/file-indexer/crawler
    newTag: v0.1.1
  - name: preview-gc
    newName: ghcr.io/jaketerrito/file-indexer/preview-gc
    newTag: v0.1.1
  - name: web
    newName: ghcr.io/jaketerrito/file-indexer/web
    newTag: v0.1.1

patches:
  - path: patch-migrate.yaml
  # Ordering dependency of the migrate wave: the SA must exist first.
  - path: patch-serviceaccount.yaml

# Environment config overrides merged into base's app-config (S3_SECURE=true
# for the hosted provider). disableNameSuffixHash must be restated here:
# generatorOptions are per-kustomization, and the merge target's name must
# match base's hash-free name.
configMapGenerator:
  - name: app-config
    behavior: merge
    envs:
      - app.env

generatorOptions:
  disableNameSuffixHash: true
