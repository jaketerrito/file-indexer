# sync-wave -1: migrations run (and complete) before the workloads roll.
# Run as an ArgoCD Sync hook so each release deletes any previous migrate
# Job before creating a new one. Job spec.template is immutable, so a plain
# apply (or Replace=true) fails once a previous Job still exists; the hook
# delete policy avoids the immutability problem entirely.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
