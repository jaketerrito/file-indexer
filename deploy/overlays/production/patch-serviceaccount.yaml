# The migrate Job runs in sync-wave -1 (patch-migrate.yaml) so migrations
# complete before workers roll. That only works if everything migrate needs
# lives in an earlier wave: ArgoCD applies a wave and waits for its health
# before starting the next, and the migrate pod cannot be created without
# this ServiceAccount. With the SA in the default wave 0, fresh deploys
# deadlocked (migrate FailedCreate: serviceaccount not found; every wave-0
# resource Missing). Pinning the SA to wave -2 preserves the ordering
# guarantee without the deadlock.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-indexer
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
