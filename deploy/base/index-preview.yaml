apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: index-preview
  template:
    metadata:
      labels:
        app: index-preview
    spec:
      serviceAccountName: file-indexer
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: index-preview
          image: index-preview
          ports:
            - name: metrics
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: db-secret
            - secretRef:
                name: s3-secret
            - configMapRef:
                name: index-config
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              # Peak usage is the source bytes plus a decoded RGBA buffer
              # (~4 bytes/pixel), bounded by PREVIEW_MAX_SOURCE_PIXELS. The
              # runner is single-threaded, so only one image is in flight.
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: index-preview
spec:
  selector:
    app: index-preview
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
