# Full-bucket scan; shorter intervals are expensive. See docs/TODO.md for the
# event-driven indexing note.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawler
spec:
  schedule: "0 1 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: file-indexer
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: crawler
              image: crawler
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              envFrom:
                - secretRef:
                    name: db-secret
                - secretRef:
                    name: s3-secret
                - configMapRef:
                    name: index-config
                - configMapRef:
                    name: app-config
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 256Mi
          volumes:
            - name: tmp
              emptyDir: {}
