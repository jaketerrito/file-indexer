apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - migrate.yaml
  - index-stat.yaml
  - index-preview.yaml
  - index-exif.yaml
  - files.yaml
  - search.yaml
  - crawler.yaml
  - web.yaml
  - preview-gc.yaml

configMapGenerator:
  - name: index-config
    literals:
      # Key prefix for objects generated by index types (previews, etc.).
      # The crawler skips it so derived objects never become files rows.
      - INDEX_PREFIX=.index/

# db-secret/s3-secret are deliberately NOT defined here: their values point at
# environment-specific infra (local postgres/MinIO for dev). The services
# consume them via envFrom; every environment supplies its own — see
# overlays/local.

generatorOptions:
  disableNameSuffixHash: true
