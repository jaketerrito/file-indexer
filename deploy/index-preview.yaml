apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: index-preview
  template:
    metadata:
      labels:
        app: index-preview
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: index-preview
          image: index-preview
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: db-secret
            - secretRef:
                name: s3-secret
            - configMapRef:
                name: index-config
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              # Peak usage is the source bytes plus a decoded RGBA buffer
              # (~4 bytes/pixel), bounded by PREVIEW_MAX_SOURCE_PIXELS. The
              # runner is single-threaded, so only one image is in flight.
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
