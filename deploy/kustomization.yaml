apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - minio.yaml
  - migrate.yaml
  - index-stat.yaml
  - index-preview.yaml
  - index-exif.yaml
  - files.yaml
  - search.yaml
  - crawler.yaml
  - web.yaml

configMapGenerator:
  - name: index-config
    literals:
      # Key prefix for objects generated by index types (previews, etc.).
      # The crawler skips it so derived objects never become files rows.
      - INDEX_PREFIX=.index/
  # The seed-data ConfigMap (minio.yaml's seed sidecar) is NOT generated
  # here: configMapGenerator's `files` only accepts explicit file paths, not
  # a directory or glob. It's generated from deploy/seed/ in the Tiltfile
  # instead, so every file dropped in that directory is seeded automatically
  # — see deploy/seed.md.

secretGenerator:
  - name: db-secret
    literals:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PASSWORD=mysecretpassword
  - name: s3-secret
    literals:
      - S3_ENDPOINT=local-s3:9000
      # Presigned download URLs must be reachable from the developer's
      # browser; Tilt forwards localhost:9000 to the local-s3 service.
      - S3_PUBLIC_ENDPOINT=localhost:9000
      - S3_ACCESS_ID=user
      - S3_SECRET=password
      - S3_BUCKET=test
      # SigV4 signing region; us-east-1 is MinIO's default.
      - S3_REGION=us-east-1

generatorOptions:
  disableNameSuffixHash: true
