apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - minio.yaml
  - migrate.yaml
  - indexer.yaml
  - files.yaml
  - search.yaml
  - crawler.yaml
  - web.yaml

secretGenerator:
  - name: db-secret
    literals:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PASSWORD=mysecretpassword
  - name: s3-secret
    literals:
      - S3_ENDPOINT=local-s3:9000
      # Presigned download URLs must be reachable from the developer's
      # browser; Tilt forwards localhost:9000 to the local-s3 service.
      - S3_PUBLIC_ENDPOINT=localhost:9000
      - S3_ACCESS_ID=user
      - S3_SECRET=password
      - S3_BUCKET=test

generatorOptions:
  disableNameSuffixHash: true
