apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - minio.yaml
  - migrate.yaml
  - index-stat.yaml
  - index-preview.yaml
  - index-exif.yaml
  - files.yaml
  - search.yaml
  - crawler.yaml
  - web.yaml
  - preview-gc.yaml
  - s3-secret.yaml

configMapGenerator:
  - name: index-config
    literals:
      # Key prefix for objects generated by index types (previews, etc.).
      # The crawler skips it so derived objects never become files rows.
      - INDEX_PREFIX=.index/
      # The seed-data ConfigMap (minio.yaml's seed sidecar) is NOT generated
      # here: configMapGenerator's `files` only accepts explicit file paths, not
      # a directory or glob. It's generated from deploy/seed/ in the Tiltfile
      # instead, so every file dropped in that directory is seeded automatically
      # — see deploy/seed.md.

secretGenerator:
  - name: db-secret
    literals:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PASSWORD=mysecretpassword
  # s3-secret is NOT generated here: S3_PUBLIC_ENDPOINT must match this
  # checkout's gateway host:port, which differs per worktree and kustomize
  # has no env substitution. It's a static manifest (s3-secret.yaml) whose
  # placeholders `tract render` substitutes in the Tiltfile's kustomize pipe.

generatorOptions:
  disableNameSuffixHash: true
