# S3_PUBLIC_ENDPOINT is the browser-facing presigned-URL host:port; both
# placeholders are substituted by `tract render` at deploy time. Static
# manifest (not secretGenerator) precisely because the values contain
# placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: s3-secret
type: Opaque
stringData:
  S3_ENDPOINT: local-s3:9000
  S3_PUBLIC_ENDPOINT: $checkout.s3.localhost:$gateway_port
  S3_ACCESS_ID: user
  S3_SECRET: password
  S3_BUCKET: test
  S3_REGION: us-east-1
