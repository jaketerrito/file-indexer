# S3_PUBLIC_ENDPOINT is the browser-facing presigned-URL host:port; the $NAMESPACE placeholder is substituted by the Tiltfile at deploy time
# (the gateway port is fixed at 18080 by hack/cluster-up.sh). Static
# manifest (not secretGenerator) precisely because the values contain
# placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: s3-secret
type: Opaque
stringData:
  S3_ENDPOINT: local-s3:9000
  S3_PUBLIC_ENDPOINT: $NAMESPACE.s3.localhost:18080
  S3_ACCESS_ID: user
  S3_SECRET: password
  S3_BUCKET: test
  S3_REGION: us-east-1
