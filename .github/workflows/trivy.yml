name: trivy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  filesystem:
    name: filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Trivy filesystem scan (vuln, misconfig, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  image:
    name: image scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [./cmd/indexer, ./cmd/migrate]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_TARGET=${{ matrix.target }} \
            --target build-release-stage \
            -t file-indexer-scan:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: file-indexer-scan:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
