name: release
on:
  push:
    branches:
      - main

# release-please opens and updates the standing release PR as github-actions[bot].
# It needs contents: write to create releases and pull-requests: write to open PRs.
# The repository setting "Allow GitHub Actions to create and approve pull requests"
# must be enabled for the PR creation to succeed.
permissions:
  contents: write
  pull-requests: write
  packages: write

# Flow: on every push to main, release-please maintains a release PR that bumps
# the version, updates CHANGELOG.md, and updates the production overlay image
# tags. Merging that PR triggers this workflow again; release-please then creates
# the GitHub release and the same run builds and pushes the container images.
# The build job is gated on release_created because releases created with the
# built-in GITHUB_TOKEN do not trigger additional workflow runs.

jobs:
  release-please:
    name: Create release PR or release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4

  build:
    name: Build and push images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: migrate
            context: .
            dockerfile: Dockerfile
            target: build-release-stage
            build_arg: BUILD_TARGET=./cmd/migrate
          - name: index-stat
            context: .
            dockerfile: Dockerfile
            target: build-release-stage
            build_arg: BUILD_TARGET=./cmd/index-stat
          - name: index-preview
            context: .
            dockerfile: Dockerfile
            target: build-release-stage
            build_arg: BUILD_TARGET=./cmd/index-preview
          - name: index-exif
            context: .
            dockerfile: Dockerfile
            target: build-release-stage
            build_arg: BUILD_TARGET=./cmd/index-exif
          - name: files
            context: .
            dockerfile: Dockerfile
            target: build-release-stage
            build_arg: BUILD_TARGET=./cmd/files
          - name: search
            context: .
            dockerfile: Dockerfile
            target: build-release-stage
            build_arg: BUILD_TARGET=./cmd/search
          - name: crawler
            context: .
            dockerfile: Dockerfile
            target: build-release-stage
            build_arg: BUILD_TARGET=./cmd/crawler
          - name: preview-gc
            context: .
            dockerfile: Dockerfile
            target: build-release-stage
            build_arg: BUILD_TARGET=./cmd/preview-gc
          - name: web
            context: web
            dockerfile: Dockerfile
            target: ""
            build_arg: ""

    steps:
      - name: Guard semver release tag
        run: |
          if [[ ! "${{ needs.release-please.outputs.tag_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z; got ${{ needs.release-please.outputs.tag_name }}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_arg }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/jaketerrito/file-indexer/${{ matrix.name }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/jaketerrito/file-indexer/${{ matrix.name }}:latest

      - name: Record image digest
        run: |
          echo "${{ matrix.name }}: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
