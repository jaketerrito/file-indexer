name: test-web
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "proto/**"
      - ".github/workflows/test-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "proto/**"
      - ".github/workflows/test-web.yml"

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          package_json_file: web/package.json
      # setup-node's built-in pnpm cache is safe to share across jobs (unlike
      # the Go caches, see README): the pnpm store is content-addressed and
      # keyed on the lockfile, so every job wants identical contents.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Run unit tests with coverage thresholds
        run: pnpm test:coverage
