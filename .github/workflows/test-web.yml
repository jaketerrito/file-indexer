name: test-web
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "proto/**"
      - ".github/workflows/test-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "proto/**"
      - ".github/workflows/test-web.yml"

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # setup-node's built-in npm cache is safe to share across jobs (unlike
      # the Go caches, see README): the npm cache is content-addressed and
      # keyed on the lockfile, so every job wants identical contents.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.5
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage
