name: test-web
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "proto/**"
      - ".github/workflows/test-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "proto/**"
      - ".github/workflows/test-web.yml"

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-node's built-in npm cache is safe to share across jobs (unlike
      # the Go caches, see README): the npm cache is content-addressed and
      # keyed on the lockfile, so every job wants identical contents.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage
