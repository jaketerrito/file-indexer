name: check-generated
on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "sqlc.yaml"
      - "internal/db/migrations/**"
      - "internal/db/queries/**"
      - ".mockery.yaml"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/generate.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "sqlc.yaml"
      - "internal/db/migrations/**"
      - "internal/db/queries/**"
      - ".mockery.yaml"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/generate.yml"

permissions:
  contents: read

jobs:
  check-generated:
    name: Check generated code is up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: generate-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            generate-go-${{ runner.os }}-
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Generate Go code
        run: go generate ./...
      - name: Generate web TS clients
        run: |
          pnpm --dir web install --frozen-lockfile
          go tool buf generate --template proto/buf.gen.web.yaml proto
      - name: Check for uncommitted changes
        run: git diff --exit-code
