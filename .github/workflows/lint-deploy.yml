name: lint-deploy
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "deploy/**"
      - ".yamlfmt"
      - ".github/workflows/lint-deploy.yml"
      - ".github/actions/setup-go-cache/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt-yaml:
    name: fmt-yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key-prefix: lint-deploy-fmt
      - name: Check YAML formatting
        run: go tool yamlfmt -lint .

  lint-k8s:
    name: lint-k8s
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key-prefix: lint-deploy-k8s
      - name: Build kustomize manifests
        run: go tool kustomize build deploy/base > manifests.yaml
      - name: Validate manifests
        run: go tool kubeconform -strict -summary manifests.yaml
