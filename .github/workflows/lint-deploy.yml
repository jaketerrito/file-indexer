name: lint-deploy
on:
  push:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "deploy/**"
      - ".yamlfmt"
      - ".github/workflows/lint-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "deploy/**"
      - ".yamlfmt"
      - ".github/workflows/lint-deploy.yml"

permissions:
  contents: read

jobs:
  fmt-yaml:
    name: fmt-yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check YAML formatting
        run: go tool yamlfmt -lint .

  lint-k8s:
    name: lint-k8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-kubectl@3951e8c4e07c0a2915e08660ac190bdc11e2d32f # v4
        with:
          # renovate: datasource=github-releases depName=kubernetes/kubernetes
          version: v1.32.0
      - name: Build kustomize manifests
        run: kubectl kustomize deploy > manifests.yaml
      - name: Validate manifests
        run: go tool kubeconform -strict -summary manifests.yaml
