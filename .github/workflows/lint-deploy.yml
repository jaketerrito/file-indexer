name: lint-deploy
on:
  push:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "deploy/**"
      - ".yamlfmt"
      - ".github/workflows/lint-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "deploy/**"
      - ".yamlfmt"
      - ".github/workflows/lint-deploy.yml"

permissions:
  contents: read

jobs:
  fmt-yaml:
    name: fmt-yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check YAML formatting
        run: go tool yamlfmt -lint .

  lint-k8s:
    name: lint-k8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build kustomize manifests
        run: go tool kustomize build deploy > manifests.yaml
      - name: Validate manifests
        run: go tool kubeconform -strict -summary manifests.yaml
