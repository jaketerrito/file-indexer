name: test
on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Convert coverage to Cobertura
        # Exclude code that is not meaningfully unit-testable from the coverage
        # gate:
        #   -ignore-gen-files : drops files marked "// Code generated ... DO NOT
        #                       EDIT" (protobuf + sqlc), which otherwise dominate
        #                       the statement count at 0%.
        #   -ignore-dirs      : belt-and-suspenders for the generated protobuf dir.
        #   -ignore-files     : cmd/*/main.go composition roots are pure wiring
        #                       with real I/O; storage/s3.go and db/migrate.go are
        #                       thin third-party-client wrappers (minio, goose)
        #                       exercised only by the build-tagged integration
        #                       tests. All are intentionally outside the unit
        #                       coverage gate.
        run: >-
          go run github.com/boumenot/gocover-cobertura@latest
          -ignore-gen-files
          -ignore-dirs 'internal/pb'
          -ignore-files '(cmd/.*/main\.go|internal/storage/s3\.go)'
          < coverage.out > coverage.xml
      - name: Code coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          format: markdown
          output: both
          badge: true
          fail_below_min: true
          thresholds: "80 95"
      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          recreate: true
          path: code-coverage-results.md
