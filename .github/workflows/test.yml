name: test
on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"
      - ".github/actions/setup-go-cache/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"
      - ".github/actions/setup-go-cache/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast feedback: unit tests only. Coverage thresholds are checked by
  # test-integration.yml's `integration` job, since unit tests alone cannot
  # reach them. Full integration suite (real DB/S3) and the kind/tilt deploy
  # verification live in test-integration.yml and deploy-verify.yml
  # respectively, both path-filtered to avoid running on every Go change.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key-prefix: test-unit
      - name: Run unit tests
        run: go test -race ./... -coverprofile=coverage.out -covermode=atomic -coverpkg=./...
