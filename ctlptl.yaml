# Local dev/CI Kubernetes cluster, managed declaratively by ctlptl
# (https://github.com/tilt-dev/ctlptl). Apply with `just cluster-up`.
#
# The registry is where Tilt pushes locally built images; Tilt auto-detects it
# through the cluster's LocalRegistryHosting config, so no registry settings
# are needed in the Tiltfile.
apiVersion: ctlptl.dev/v1alpha1
kind: Registry
name: ctlptl-registry
---
apiVersion: ctlptl.dev/v1alpha1
kind: Cluster
product: kind
registry: ctlptl-registry
