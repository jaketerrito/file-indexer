syntax = "proto3";

package service.v1;

import "google/protobuf/timestamp.proto";

option go_package = "file-indexer/internal/pb/service/v1;pb";

service FilesService {
  rpc GetDownloadURL(GetDownloadURLRequest) returns (GetDownloadURLResponse);
  rpc GetPreviewURL(GetPreviewURLRequest) returns (GetPreviewURLResponse);
  rpc GetFileInfo(GetFileInfoRequest) returns (GetFileInfoResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc GetUploadURL(GetUploadURLRequest) returns (GetUploadURLResponse);
  rpc CommitUpload(CommitUploadRequest) returns (CommitUploadResponse);
  rpc GetDirectoryStats(GetDirectoryStatsRequest) returns (GetDirectoryStatsResponse);
  rpc DeleteDirectory(DeleteDirectoryRequest) returns (DeleteDirectoryResponse);
  rpc GetFilePreviewStatuses(GetFilePreviewStatusesRequest) returns (GetFilePreviewStatusesResponse);
}

message GetFilePreviewStatusesRequest {
  repeated int64 ids = 1;
}

message FilePreviewStatus {
  int64 id = 1;
  PreviewStatus preview_status = 2;
  // Presigned preview URL when status is READY; empty otherwise.
  string preview_url = 3;
}

message GetFilePreviewStatusesResponse {
  repeated FilePreviewStatus statuses = 1;
}

message GetDownloadURLRequest {
  repeated int64 ids = 1;
}

message DownloadURLSpec {
  int64 id = 1;
  string url = 2;
}

message GetDownloadURLResponse {
  repeated DownloadURLSpec download_urls = 1;
}

message GetPreviewURLRequest {
  repeated int64 ids = 1;
}

message PreviewURLSpec {
  int64 id = 1;
  string url = 2;
}

message GetPreviewURLResponse {
  // Only files that actually have a preview appear here; ids without one are
  // omitted rather than returned with an empty url.
  repeated PreviewURLSpec preview_urls = 1;
}

message GetFileInfoRequest {
  int64 id = 1;
}

message FileInfo {
  int64 id = 1;
  string key = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Object key of the generated preview image. Empty when the file has no
  // preview: it is not an image, or the preview index has not run yet.
  string preview_key = 7;
  // Dimensions of the preview image; zero when preview_key is empty. Aspect
  // ratio is preserved and sources are never upscaled, so these vary per file.
  int32 preview_width = 8;
  int32 preview_height = 9;
  // EXIF/XMP metadata, present only for image/camera-RAW files that carry at
  // least one of the two. Unset when the file has no exif index result yet,
  // or has neither EXIF nor XMP data.
  ExifMetadata exif = 10;
  // Where this file stands in the preview index pipeline, so clients can
  // distinguish "no preview is coming" from "not yet indexed" — both surface
  // as an empty preview_key. Computed from the index queue by SearchService
  // list RPCs; UNSPECIFIED from RPCs that do not compute it.
  PreviewStatus preview_status = 11;
}
// PreviewStatus describes a file's position in the preview index pipeline.
enum PreviewStatus {
  // The RPC did not compute a status.
  PREVIEW_STATUS_UNSPECIFIED = 0;
  // No preview exists and none is coming: the file is not an image, or the
  // preview indexer processed it and produced nothing (e.g. unsupported or
  // oversized source).
  PREVIEW_STATUS_NONE = 1;
  // Indexing is in flight: the job is queued, or the file is so new that
  // queue seeding has not enqueued it yet and (without a stat result) its
  // content type is not yet known.
  PREVIEW_STATUS_PENDING = 2;
  // An indexer holds the job right now.
  PREVIEW_STATUS_PROCESSING = 3;
  // preview_key is set; the preview is ready to serve.
  PREVIEW_STATUS_READY = 4;
  // Indexing attempts are exhausted; the job is parked as error until
  // manually reset.
  PREVIEW_STATUS_FAILED = 5;
}

// EXIF and XMP metadata extracted from an image or camera-RAW file. Mirrors
// internal/db/migrations/003_exif.sql; every field is optional because
// EXIF/XMP tags are sparse (most cameras omit most tags) and absence must be
// distinguishable from a legitimate zero value.
message ExifMetadata {
  // Sniffed image type from the metadata parser (e.g. "image/x-canon-cr2"),
  // which may differ from FileInfo.content_type as reported by S3.
  optional string image_type = 1;

  optional string camera_make = 2;
  optional string camera_model = 3;
  optional string camera_serial = 4;
  optional string lens_make = 5;
  optional string lens_model = 6;

  // Naive (zone-less) local capture time as recorded by the camera clock.
  // EXIF DateTimeOriginal carries no offset, so no timezone is attached.
  google.protobuf.Timestamp taken_at = 7;

  optional int32 iso = 8;
  optional float f_number = 9;
  optional float exposure_time = 10; // seconds
  optional float focal_length = 11; // millimeters
  optional float focal_length_35mm = 12; // millimeters, 35mm-equivalent
  optional int32 exposure_program = 13;
  optional int32 metering_mode = 14;
  optional int32 flash = 15;

  optional int32 orientation = 16;
  optional int32 image_width = 17;
  optional int32 image_height = 18;

  // GPS, kept at full precision (private, single-tenant bucket).
  optional double gps_latitude = 19;
  optional double gps_longitude = 20;
  optional float gps_altitude = 21;
  // Unlike taken_at, GPS timestamps are unambiguously UTC per the EXIF spec.
  google.protobuf.Timestamp gps_at = 22;

  optional string software = 23;
  optional string artist = 24;
  optional string copyright = 25;
  optional string image_description = 26;

  optional string xmp_title = 27;
  optional string xmp_description = 28;
  optional string xmp_creator = 29;
  optional string xmp_label = 30;
  optional int32 xmp_rating = 31;
  repeated string xmp_keywords = 32;
  // XMP xmp:CreateDate carries a zone offset, unlike taken_at.
  google.protobuf.Timestamp xmp_create_date = 33;

  // Which of EXIF/XMP contributed to this metadata, so an absent field can
  // be told apart from "no EXIF/XMP block was present at all".
  bool has_exif = 34;
  bool has_xmp = 35;
}

message GetFileInfoResponse {
  FileInfo file = 1;
}

message DeleteFileRequest {
  int64 id = 1;
}

message DeleteFileResponse {}

message GetUploadURLRequest {
  // Destination object key. The client sets its own Content-Type header on
  // the PUT; CommitUpload re-stats the object afterward rather than trusting
  // anything about the upload, so it is not threaded through here.
  string key = 1;
}

message GetUploadURLResponse {
  string url = 1;
}

message CommitUploadRequest {
  // Key the client PUT its bytes to via the GetUploadURL URL.
  string key = 1;
}

message CommitUploadResponse {
  // Stat-derived record for the newly-landed object. Indexing (previews,
  // EXIF, etc.) is asynchronous — this reflects only what S3 knows
  // immediately, not full FileInfo.
  FileInfo file = 1;
}

message GetDirectoryStatsRequest {
  // Directory prefix; must end in "/" (validated server-side) so a prefix
  // like "docs" can never match "docs-archive/" too.
  string path = 1;
}

message GetDirectoryStatsResponse {
  int64 file_count = 1;
  int64 total_bytes = 2;
}

message DeleteDirectoryRequest {
  // Same validation as GetDirectoryStats.path. There is no dry-run flag:
  // callers are expected to show GetDirectoryStats' counts in a confirm
  // dialog first (see web/src/components/Browser.tsx's delete-folder flow).
  string path = 1;
}

message DeleteDirectoryResponse {
  // Number of files actually removed (S3 object + DB row both succeeded)
  // before either finishing or hitting an error. Not atomic: on error, some
  // prefix of the directory's files may already be gone while the rest
  // remain — retry with the same path to continue, S3 no-ops keys already
  // deleted.
  int64 deleted_count = 1;
}
