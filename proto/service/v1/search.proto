syntax = "proto3";

package service.v1;

import "buf/validate/validate.proto";
import "service/v1/files.proto";

option go_package = "file-indexer/internal/pb/service/v1;pb";

service SearchService {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  rpc ListContentTypes(ListContentTypesRequest) returns (ListContentTypesResponse);
}

// SortField selects the column ListFiles orders results by.
enum SortField {
  SORT_FIELD_UNSPECIFIED = 0; // defaults to SORT_FIELD_KEY
  SORT_FIELD_KEY = 1;
  // Object last-modified time (from the stat index); unset until a file is
  // indexed, sorting those files first ascending.
  SORT_FIELD_LAST_MODIFIED = 2;
  SORT_FIELD_SIZE = 3;
}

// SortOrder selects the direction ListFiles orders results in.
enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0; // defaults to SORT_ORDER_ASC
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

message ListFilesRequest {
  // Maximum number of files to return. Defaults to 50, clamped to 200.
  // Negative values are rejected (buf.validate).
  int32 page_size = 1 [(buf.validate.field).int32.gte = 0];
  // A page token, received from a previous ListFiles call's next_page_token.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to ListFiles (except
  // page_size) must match the call that provided the page token; otherwise
  // the request fails with INVALID_ARGUMENT.
  string page_token = 2;
  // Only return files whose key starts with this prefix.
  string prefix = 3;
  // Filter by MIME type: an exact match like "image/png", or a category
  // prefix ending in "/" like "image/" to match all images.
  string content_type = 4;
  SortField sort_field = 5 [(buf.validate.field).enum.defined_only = true];
  SortOrder sort_order = 6 [(buf.validate.field).enum.defined_only = true];
}

message ListFilesResponse {
  repeated FileInfo files = 1;
  // Cursor for the next page; empty when there are no more results.
  string next_page_token = 2;
}

// ListDirectory lists the immediate children of a directory: subdirectories
// (materialized in a dedicated index kept in sync with every file write —
// see the directories table's doc comment in
// internal/db/migrations/001_initial.sql; a directory "exists" only as long
// as some key lives under it, same as S3 itself) followed by the files
// directly in it. There is no content_type filter here: applying one
// requires per-directory subtree checks that don't fit this index, so a
// client that wants to filter by type should switch to ListFiles from this
// path instead (browsing is navigation; filtering is search).
message ListDirectoryRequest {
  // Directory to list; "" is the bucket root. Normalized to a trailing "/"
  // server-side if the caller omits one.
  string path = 1;
  // Maximum number of entries (directories + files combined) to return.
  // Defaults to 50, clamped to 200, same as ListFiles.
  // Negative values are rejected (buf.validate).
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];
  string page_token = 3;
  // Sort applies to the files portion only; directories are always
  // alphabetical and always precede files on a given page.
  SortField sort_field = 4 [(buf.validate.field).enum.defined_only = true];
  SortOrder sort_order = 5 [(buf.validate.field).enum.defined_only = true];
}

message ListDirectoryResponse {
  // Immediate child directories, full path from the bucket root, each
  // ending in "/". Always alphabetical, always before files.
  repeated string directories = 1;
  repeated FileInfo files = 2;
  string next_page_token = 3;
}

message ListContentTypesRequest {}

message ListContentTypesResponse {
  // Distinct top-level MIME categories present in the stat index, each
  // ending in "/" (e.g. "image/"), sorted ascending. Every value is a valid
  // content_type filter for ListFiles (category-prefix semantics), so a
  // filter UI can offer exactly the categories that match at least one
  // indexed file.
  repeated string categories = 1;
}
