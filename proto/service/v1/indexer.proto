syntax = "proto3";

package service.v1;

option go_package = "file-indexer/internal/pb";

service IndexerService {
  rpc Index(IndexRequest) returns (IndexResponse) {}
}

message IndexRequest {
  FileRef ref = 1;
}

message FileRef {
  string key = 1;
}

message IndexResponse {
  string status = 1;
}
