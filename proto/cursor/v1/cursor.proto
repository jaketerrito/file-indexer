syntax = "proto3";

package cursor.v1;

import "google/protobuf/timestamp.proto";
import "service/v1/search.proto";

option go_package = "file-indexer/internal/pb/cursor/v1;cursorv1";

// PageToken is the internal wire format of a ListFiles page token. It is
// serialized and base64url-encoded before being returned to clients, and is
// never part of the public API surface (AIP-158: tokens are opaque).
//
// It records the query the token was issued for (sort and filters, so the
// server can reject requests whose arguments changed mid-pagination) and the
// keyset position of the last row returned (last_id plus the sort value
// matching sort_field).
message PageToken {
  service.v1.SortField sort_field = 1;
  service.v1.SortOrder sort_order = 2;
  // ID of the last row on the previous page; keyset tie-breaker.
  int64 last_id = 3;
  // Sort value of the last row; only the field matching sort_field is set.
  string key = 4;
  google.protobuf.Timestamp last_modified = 5;
  // Matches COALESCE(size_bytes, 0) in the list queries.
  int64 size = 6;
  // Filters the token was issued for, stored raw (before LIKE escaping).
  string prefix = 7;
  string content_type = 8;
}
