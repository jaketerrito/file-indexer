# TypeScript codegen for the web frontend (web/). Run from the repo root:
#   go tool buf generate --template proto/buf.gen.web.yaml proto
# (part of `just generate`)
#
# protoc-gen-es comes from web/node_modules, so `npm install` must have run
# in web/ first. It generates message types and service descriptors consumed
# by @connectrpc/connect in TanStack Start server functions.
version: v2
clean: true
plugins:
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
